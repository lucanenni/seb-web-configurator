<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEB Configurator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600&display=swap">
<style>
/* Layout: una colonna stretta per l'uso semplice; la modalità avanzata si apre sotto, a tutta larghezza, in schede. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --fg: #16202e;
  --muted: #5b6676;
  --line: #d6dce6;
  --accent: #1f5fd1;
  --accent-fg: #ffffff;
  --accent-soft: #e6eefc;
  --ok: #17713f;
  --err: #b3261e;
  --field: #fbfcfe;
  --win: #7a4b00;
  --win-bg: #fdf0d8;
  --mac: #3b4a8a;
  --mac-bg: #e7eafb;
  --ios: #0b6b5b;
  --ios-bg: #dcf3ee;
  --font-text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151e; --surface: #18202c; --fg: #e8edf5; --muted: #98a3b5;
    --line: #2b3646; --accent: #6b9bf2; --accent-fg: #0b1220; --accent-soft: #1c2a44;
    --ok: #5fc58a; --err: #ff8a80; --field: #121a25;
    --win: #f0c27a; --win-bg: #3a2c12; --mac: #aab8f5; --mac-bg: #232a4a; --ios: #7fd6c4; --ios-bg: #14352f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151e; --surface: #18202c; --fg: #e8edf5; --muted: #98a3b5;
  --line: #2b3646; --accent: #6b9bf2; --accent-fg: #0b1220; --accent-soft: #1c2a44;
  --ok: #5fc58a; --err: #ff8a80; --field: #121a25;
  --win: #f0c27a; --win-bg: #3a2c12; --mac: #aab8f5; --mac-bg: #232a4a; --ios: #7fd6c4; --ios-bg: #14352f; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-text);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
}
main { max-width: 560px; margin: 0 auto; display: grid; gap: 20px; transition: max-width .2s; }
main.wide { max-width: 980px; }
h1 { font: 600 26px/1.2 var(--font-head); margin: 0; text-wrap: balance; }
.lead { margin: 6px 0 0; color: var(--muted); }
form {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 22px; display: grid; gap: 20px; min-width: 0;
}
label.t { display: block; font-weight: 600; margin-bottom: 6px; }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
input[type=url], input[type=text], input[type=password], input[type=number], input[type=search], select, textarea {
  width: 100%; font: inherit; color: var(--fg); background: var(--field);
  border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; min-width: 0;
}
textarea { min-height: 84px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
input:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.check span { min-width: 0; }
.check b { font-weight: 600; display: block; }
.pw { display: flex; gap: 8px; margin-top: 10px; }
.ghost {
  font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 12px; cursor: pointer; white-space: nowrap;
}
.ghost:hover { border-color: var(--accent); }
.ghost.sm { padding: 2px 8px; font-size: 12px; }
.go {
  font: 600 15px var(--font-text); color: var(--accent-fg); background: var(--accent);
  border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer;
}
.go:hover { filter: brightness(1.08); }
.go:disabled { opacity: .6; cursor: default; }
#msg { margin: 0; min-height: 1.5em; }
#msg.ok { color: var(--ok); } #msg.err { color: var(--err); }
.how { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; }
.how h2 { font: 600 15px var(--font-head); margin: 0 0 8px; }
.how ol { margin: 0; padding-left: 20px; color: var(--muted); display: grid; gap: 4px; }
.how code, .hint code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; color: var(--fg); }
.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; gap: 10px 16px; flex-wrap: wrap; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--line);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tb { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.go { padding: 8px 16px; }
.lang, .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex: none; }
.lang button, .seg button { font: 500 13px var(--font-text); color: var(--muted); background: transparent; border: 0; padding: 5px 10px; cursor: pointer; }
.lang button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }


/* modalità avanzata */
#adv { display: grid; gap: 14px; min-width: 0; }
.advnote { color: var(--muted); font-size: 13px; margin: 0; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tools input[type=search] { max-width: 320px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tab {
  font: 500 14px var(--font-text); color: var(--muted); background: transparent; border: 1px solid transparent;
  border-bottom: 0; border-radius: 6px 6px 0 0; padding: 8px 12px; cursor: pointer; margin-bottom: -1px;
}
.tab[aria-selected="true"] { color: var(--fg); background: var(--surface); border-color: var(--line); }
.tab:hover { color: var(--fg); }
.tab .n { color: var(--accent); font-size: 12px; margin-left: 4px; }
.panel { display: grid; gap: 0; min-width: 0; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 18px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.field:last-child { border-bottom: 0; }
.field .lab { min-width: 0; }
.field .lab b { font-weight: 500; overflow-wrap: anywhere; }
.field .lab .k { display: block; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.field .lab .tip { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.field .ctl { display: flex; gap: 8px; align-items: center; min-width: 0; }
.field .ctl input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.field.mod .lab b::after { content: " ●"; color: var(--accent); font-size: 11px; }
.badge { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 1px; }
.badge.w { color: var(--win); background: var(--win-bg); }
.badge.m { color: var(--mac); background: var(--mac-bg); }
.badge.i { color: var(--ios); background: var(--ios-bg); }
.sub { font: 600 14px var(--font-head); margin: 18px 0 6px; }
.rows { display: grid; gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; background: var(--field); min-width: 0; }
.card .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px 12px; }
.card .grid > div { min-width: 0; }
.card .grid small { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
.card .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card .check { align-items: center; }
.card .check input { margin: 0; }
.args { display: grid; gap: 6px; border-top: 1px dashed var(--line); padding-top: 8px; }
.args .a { display: flex; gap: 8px; align-items: center; }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
@media (max-width: 640px) { .field { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .ghost, .go { transition: filter .15s, border-color .15s; } }
</style>

<main id="main">
  <header class="top">
    <h1 data-i18n="title">Configuratore SEB</h1>
    <p class="lead" data-i18n-html="lead"></p>
  </header>

  <div class="toolbar">
    <div class="tb">
      <button type="button" class="ghost" id="openbtn" data-i18n="open" data-i18n-title="open_hint"></button>
      <input id="openfile" type="file" accept=".seb,.txt,application/octet-stream" hidden>
      <button class="go" id="go" type="submit" form="f" data-i18n="go"></button>
    </div>
    <div class="tb">
      <div class="seg" role="group" aria-label="Mode / Modalità" data-i18n-title="adv_t">
        <button type="button" data-mode="0" aria-pressed="true" data-i18n="mode_simple"></button>
        <button type="button" data-mode="1" aria-pressed="false" data-i18n="mode_adv"></button>
      </div>
      <div class="lang" role="group" aria-label="Language / Lingua">
        <button type="button" data-lang="it" aria-pressed="true">IT</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <input id="advon" type="checkbox" hidden>
    </div>
  </div>

  <div id="loadpw" class="tools" hidden>
    <input id="loadpwin" type="password" autocomplete="off" data-i18n-ph="loadpw_ph" data-i18n-aria="loadpw_ph" style="max-width:240px">
    <button type="button" class="ghost" id="loadpwgo" data-i18n="open_go"></button>
  </div>
  <p id="msg" role="status" aria-live="polite"></p>

  <form id="f" novalidate>
    <div>
      <label class="t" for="url" data-i18n="url_label"></label>
      <input id="url" data-key="startURL" type="url" inputmode="url" autocomplete="off" placeholder="https://…" required>
      <p class="hint" data-i18n="url_hint"></p>
    </div>

    <label class="check" for="full">
      <input id="full" data-key="browserViewMode" data-kind="full" type="checkbox" checked>
      <span><b data-i18n="full_b"></b><span data-i18n="full_t"></span></span>
    </label>

    <div>
      <label class="check" for="enc">
        <input id="enc" type="checkbox">
        <span><b data-i18n="enc_b"></b><span data-i18n="enc_t"></span></span>
      </label>
      <div class="pw" id="pwrow">
        <input id="pw" type="password" autocomplete="off" data-i18n-ph="pw_ph" data-i18n-aria="pw_ph">
        <button type="button" class="ghost" id="show" aria-pressed="false" data-i18n="show"></button>
      </div>
    </div>

    <div>
      <label class="t" for="quit" data-i18n="quit_label"></label>
      <input id="quit" data-key="hashedQuitPassword" type="text" autocomplete="off">
      <p class="hint" data-i18n="quit_hint"></p>
    </div>

    <p class="hint" style="margin:0" data-i18n="fixed_hint"></p>

    <section id="adv" hidden>
      <p class="advnote" data-i18n-html="advnote"></p>
      <div class="tools">
        <input id="q" type="search" data-i18n-ph="search_ph" data-i18n-aria="search_ph">
        <button type="button" class="ghost" id="resetall" data-i18n="resetall"></button>
      </div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="panel" id="panel" role="tabpanel"></div>
    </section>
  </form>

  <section class="how">
    <h2 data-i18n="how_h"></h2>
    <ol>
      <li data-i18n-html="how1"></li>
      <li data-i18n-html="how2"></li>
      <li data-i18n-html="how3"></li>
    </ol>
  </section>
</main>

/* ---- core ---- */
const enc8 = new TextEncoder();

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function sha256hex(s) {
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", enc8.encode(s)));
  return Array.from(h, (b) => b.toString(16).padStart(2, "0")).join("");
}

/* Un link di modifica (/edit) apre l'editor: per gli studenti serve /viewform. */
function toViewForm(href) {
  const u = new URL(href);
  if (u.hostname === "docs.google.com" && /^\/forms\/d\/[^/]+\/edit\/?$/.test(u.pathname)) {
    u.pathname = u.pathname.replace(/\/edit\/?$/, "/viewform");
    u.search = ""; u.hash = "";
  }
  return u.href;
}

/* Serializza un valore in formato plist. type "float" forza <real>. */
function ser(v, type, pad) {
  pad = pad || "";
  if (typeof v === "boolean") return v ? "<true/>" : "<false/>";
  if (typeof v === "number") return type === "float" || !Number.isInteger(v) ? `<real>${v}</real>` : `<integer>${v}</integer>`;
  if (v && v.__raw !== undefined) return v.__raw;
  if (Array.isArray(v)) {
    if (!v.length) return "<array/>";
    return "<array>\n" + v.map((x) => pad + "\t" + ser(x, null, pad + "\t")).join("\n") + "\n" + pad + "</array>";
  }
  if (v && typeof v === "object") {
    const ks = Object.keys(v);
    if (!ks.length) return "<dict/>";
    return "<dict>\n" + ks.map((k) => `${pad}\t<key>${esc(k)}</key>\n${pad}\t${ser(v[k], null, pad + "\t")}`).join("\n") + "\n" + pad + "</dict>";
  }
  return `<string>${esc(v)}</string>`;
}

/* entries: [[chiave, valore, tipo?], ...] */
function plistDoc(entries) {
  return '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n' +
    '<plist version="1.0">\n<dict>\n' +
    entries.map(([k, v, t]) => `\t<key>${esc(k)}</key>\n\t${ser(v, t, "\t")}`).join("\n") +
    '\n</dict>\n</plist>\n';
}

async function gzip(bytes) {
  const cs = new CompressionStream("gzip");
  const w = cs.writable.getWriter();
  w.write(bytes); w.close();
  return new Uint8Array(await new Response(cs.readable).arrayBuffer());
}

function concat(...parts) {
  const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}

async function deriveKey(pw, salt, usage, alg) {
  const base = await crypto.subtle.importKey("raw", enc8.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 10000, hash: "SHA-1" },
    base, alg, false, usage);
}

/* RNCryptor v3, modalità password: 03 01 | salt cifratura 8 | salt HMAC 8 | IV 16 | dati AES-256-CBC | HMAC-SHA256 32 */
async function rnEncrypt(data, pw) {
  const encSalt = crypto.getRandomValues(new Uint8Array(8));
  const hmacSalt = crypto.getRandomValues(new Uint8Array(8));
  const iv = crypto.getRandomValues(new Uint8Array(16));
  const encKey = await deriveKey(pw, encSalt, ["encrypt"], { name: "AES-CBC", length: 256 });
  const hmacKey = await deriveKey(pw, hmacSalt, ["sign"], { name: "HMAC", hash: "SHA-256", length: 256 });
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-CBC", iv }, encKey, data));

async function gunzip(bytes) {

async function rnDecrypt(data, pw) {

async function readSeb(bytes, pw) {
  let b = isGz(bytes) ? await gunzip(bytes) : bytes;
  const pre = new TextDecoder().decode(b.slice(0, 4));
  let enc = false;
  if (pre === "pswd" || pre === "pwcc") {
    if (pw == null) throw { code: "need-password" };

    const body = b.slice(4);
    try { b = await rnDecrypt(body, pre === "pwcc" ? await sha256hex(pw) : pw); }

async function makeSeb(entries, password) {

  const enc = await rnEncrypt(inner, password);

function inputFor(type, val, opts, onChange, label) {
  let el;
  if (type === "bool") { el = document.createElement("input"); el.type = "checkbox"; el.checked = !!val; el.addEventListener("change", () => onChange(el.checked)); }
  else if (type === "enum") { el = document.createElement("select"); for (const [v, tx] of opts) el.add(new Option(tx, v)); el.value = val; el.addEventListener("change", () => onChange(Number(el.value))); }
  else if (type === "int") { el = document.createElement("input"); el.type = "number"; el.value = val; el.addEventListener("input", () => onChange(Number(el.value) || 0)); }
  else { el = document.createElement("input"); el.type = "text"; el.value = val; el.autocomplete = "off"; el.addEventListener("input", () => onChange(el.value)); }
  if (label) el.setAttribute("aria-label", label);
  return el;
}

function toB64(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
/* campo "file": incorpora i byte come <data> base64; i certificati PEM vengono convertiti in DER */
function fileField(row, k, label, mode) {
  const d = document.createElement("div"), line = document.createElement("div");
  line.className = "row";
  const inp = document.createElement("input"); inp.type = "file"; inp.hidden = true;
  if (mode === "cert") inp.accept = ".cer,.crt,.der,.pem,.p12,.pfx";
  const info = document.createElement("span"); info.className = "hint"; info.style.margin = "0";
  const upd = () => {
    const v = row[k], m = v && v.__raw ? v.__raw.match(/^<data[^>]*>([\s\S]*)<\/data>$/) : null;

  };
  inp.addEventListener("change", async () => {
    const f = inp.files[0]; inp.value = "";

    const bytes = new Uint8Array(await f.arrayBuffer());
    const pem = mode === "cert" ? new TextDecoder().decode(bytes).match(/-----BEGIN CERTIFICATE-----([\s\S]*?)-----END CERTIFICATE-----/) : null;
    row[k] = { __raw: `<data>${pem ? pem[1].replace(/\s+/g, "") : toB64(bytes)}</data>` };

/* ---- apertura di un .seb esistente ---- */
function parseVal(el) {
  switch (el.tagName) {
    case "dict": return parseDict(el);
    case "array": return [...el.children].map(parseVal);
    case "string": return el.textContent;
    case "integer": return parseInt(el.textContent, 10);
    case "real": return parseFloat(el.textContent);
    case "true": return true;
    case "false": return false;
    default: return { __raw: new XMLSerializer().serializeToString(el) };
  }
}
function dictPairs(el) {
  const ch = [...el.children], out = [];
  for (let i = 0; i + 1 < ch.length; i += 2) out.push([ch[i].textContent, ch[i + 1]]);
  return out;
}
function parseDict(el) { const o = {}; for (const [k, v] of dictPairs(el)) o[k] = parseVal(v); return o; }
function coerce(e, v) {
  if (e.t === "bool") return v === true || v === 1;
  if (e.t === "int" || e.t === "float") return Number(typeof v === "object" ? 0 : v) || 0;
  return v == null || typeof v === "object" ? "" : String(v);
}

function applyFile(xml) {
  const doc = new DOMParser().parseFromString(xml, "text/xml");
  const root = doc.querySelector("plist > dict");
  if (doc.querySelector("parsererror") || !root) throw { code: "format" };
  resetState(false);
  extraOn = false;
  for (const [k, vEl] of dictPairs(root)) {
    const e = BYKEY[k];
    if (k === "sebConfigPurpose") { PURPOSE = parseInt(vEl.textContent, 10) || 0; continue; }
    if (e) {
      const v = parseVal(vEl);
      if (e.t === "pw") { if (typeof v === "string" && v) { HASHES[k] = v; touched.add(k); } }
      else { S[k] = coerce(e, v); if (k === "startURL" ? S[k] !== "" : true) touched.add(k); }
    } else if (ROWKEYS[k] && vEl.tagName === "array") {
      const name = ROWKEYS[k];
      LISTS[name].rows = parseVal(vEl).filter(isObj).map((r) => normRow(LISTDEF[name], r));
    } else if (STRKEYS[k] && vEl.tagName === "array") {
      STRLISTS[STRKEYS[k]].lines = parseVal(vEl).filter((x) => typeof x === "string");
    } else if (k === "proxies" && vEl.tagName === "dict") {
      PROXY.v = Object.assign(PROXY0(), parseDict(vEl)); PROXY.on = true;
    } else if (k === "sebServerConfiguration" && vEl.tagName === "dict") {
      SEBSRV.v = Object.assign(SEBSRV0(), parseDict(vEl)); SEBSRV.on = true;
    } else PASSTHRU.push([k, { __raw: new XMLSerializer().serializeToString(vEl) }]);
  }
}

let pendingFile = null;
async function tryLoad(bytes, pw) {
  try {
    const r = await readSeb(bytes, pw);
    applyFile(r.xml);
    pendingFile = null; $("loadpw").hidden = true; $("loadpwin").value = "";
    $("enc").checked = r.enc; syncPw(); $("pw").value = r.enc ? pw : "";
    refreshAll();
    if (!$("advon").checked) { $("advon").checked = true; $("advon").dispatchEvent(new Event("change")); }
    const n = touched.size + Object.keys(HASHES).length + Object.values(LISTS).reduce((a, l) => a + l.rows.length, 0) + (PROXY.on ? 1 : 0) + (SEBSRV.on ? 1 : 0) + Object.values(STRLISTS).filter((l) => l.lines.length).length + PASSTHRU.length;
    msg(t("m_opened", n) + (PURPOSE === 1 ? t("m_purpose") : ""), "ok");
  } catch (e) {
    if (e && e.code === "need-password") { pendingFile = bytes; $("loadpw").hidden = false; $("loadpwin").focus(); msg(t("m_needpw")); }
    else if (e && e.code === "password") msg(t("m_badpw"), "err");
    else if (e && e.code === "cert") msg(t("m_cert"), "err");
    else msg(t("m_badfile"), "err");
  }
}

$("show").addEventListener("click", () => {

async function collect(url) {
  const out = [], seen = new Set();
  const put = (k, v, t) => { if (!seen.has(k)) { seen.add(k); out.push([k, v, t]); } };
  put("startURL", url);
  put("sebConfigPurpose", PURPOSE);
  for (const e of SCHEMA.items) {
    if (e.k === "startURL" || (!touched.has(e.k) && !HASHES[e.k])) continue;
    let v = S[e.k];
    if (e.t === "pw") { if (v) v = await sha256hex(v); else if (HASHES[e.k]) v = HASHES[e.k]; else continue; }
    else if (e.t === "string" && v === "" && e.d === "") continue;
    put(e.k, v, e.t === "float" ? "float" : null);
  }
  for (const k of Object.keys(BASE)) if (!seen.has(k) && !(BYKEY[k])) put(k, BASE[k]);
  if (extraOn) for (const [k, v] of EXTRA) put(k, v);
  for (const [name, L] of Object.entries(LISTS)) {
    let rows = L.rows;
    if (name === "certs") rows = rows.filter((r) => r.certificateData && r.certificateData.__raw);
    if (name === "additional") rows = rows.map((r) => (r.URL && !r.url ? { ...r, url: r.URL } : r));
    if (rows.length) put(L.key, rows);
  }
  for (const L of Object.values(STRLISTS)) if (L.lines.length) put(L.key, L.lines);
  if (PROXY.on) put("proxies", PROXY.v);
  if (SEBSRV.on) put("sebServerConfiguration", SEBSRV.v);
  for (const [k, v] of PASSTHRU) put(k, v);
  return out;
}

async function deliver(bytes) {
  let dl = null;
  try { dl = window.claude && (await claude.use("downloads")); } catch (e) { dl = null; }
  if (dl) {
    try {
      await dl.save({ filename: t("fname"), data: bytes });
      return t("m_saved", t("fname"));
    } catch (e) {
      if (e && e.code === "rejected_extension") {
        await dl.save({ filename: t("fname") + ".txt", data: bytes });
        return t("m_saved_txt", t("fname"));
      }
      throw e;
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" }));
  a.download = t("fname");
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return t("m_created", t("fname"));
}

$("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const raw = $("url").value.trim();
  let u;
  try { u = new URL(raw); if (!/^https?:$/.test(u.protocol)) throw 0; }
  catch (e) { msg(t("m_url"), "err"); $("url").focus(); return; }
  const useEnc = $("enc").checked, pw = $("pw").value;
  if (useEnc && !pw) { msg(t("m_pw"), "err"); $("pw").focus(); return; }
  $("go").disabled = true; msg("");
  try {
    const bytes = await makeSeb(await collect(toViewForm(u.href)), useEnc ? pw : null);
    msg(await deliver(bytes), "ok");
  } catch (e) {
    if (e && e.code === "declined") msg(t("m_cancel"), "");
    else msg(t("m_fail"), "err");
  } finally { $("go").disabled = false; }
});
applyLang();
